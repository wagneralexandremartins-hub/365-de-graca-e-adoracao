name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Montar site publicável (sem backups, scripts e notas de trabalho)
        run: |
          mkdir -p _site
          rsync -a \
            --exclude='.git/' \
            --exclude='_site/' \
            --exclude='_backups/' \
            --exclude='scripts/' \
            --exclude='.github/' \
            --exclude='*.md' \
            --exclude='*.py' \
            --exclude='generate-sitemap.js' \
            --exclude='package.json' \
            --exclude='.gitignore' \
            --exclude='vercel.json' \
            ./ _site/
          touch _site/.nojekyll
          echo "365gracaeadoracao.com" > _site/CNAME

      - name: Upload do artefato do Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
